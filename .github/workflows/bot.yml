name: talesrunner-bot

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "13 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = ทดสอบกับไลฟ์เก่า / watch = เฝ้าไลฟ์ / rescan = สแกนย้อนหลัง"
        type: choice
        options: [test, watch, rescan]
        default: test
      url:
        description: "ลิงก์ไลฟ์เก่า (ใช้กับ test)"
        default: "https://www.youtube.com/watch?v=fTLz4UO0q-I"
      post:
        description: "ส่งโค้ดที่เจอเข้า Discord"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  watch:
    if: github.event.schedule == '7,37 * * * *' || inputs.mode == 'watch'
    concurrency:
      group: watch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Optional YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
      - name: Quick check (live now or schedule window?)
        id: check
        env:
          YT_COOKIES_FILE: cookies.txt
        run: |
          pip install -q -U --pre "yt-dlp[default]" requests
          echo "run=$(python watcher.py should-run | tail -n1)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        if: steps.check.outputs.run == 'yes'
        with:
          deno-version: v2.x
      - name: Install
        if: steps.check.outputs.run == 'yes'
        run: |
          sudo apt-get install -y -qq ffmpeg libgl1 > /dev/null
          pip install -q -r requirements.txt
          pip install -q -U --pre "yt-dlp[default]"   # newest yt-dlp (incl. nightly): YouTube changes often
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch
        if: steps.check.outputs.run == 'yes'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_COOKIES_FILE: cookies.txt
          GIT_PERSIST: "1"
        run: python watcher.py watch --max-minutes 330
      # GitHub's timer is unreliable, so each run starts the next one while streams may still be on
      #   (watcher.py leaves a .continue file only when it ran out of time, never after a crash)
      - name: Keep watching (start next run)
        if: always() && hashFiles('.continue') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" -f mode=watch

  rescan:
    if: github.event.schedule == '13 19 * * *' || inputs.mode == 'rescan'
    concurrency:
      group: rescan
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg libgl1 > /dev/null
          pip install -q -r requirements.txt
          pip install -q -U --pre "yt-dlp[default]"   # newest yt-dlp (incl. nightly): YouTube changes often
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Optional YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
      - name: Rescan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_COOKIES_FILE: cookies.txt
          GIT_PERSIST: "1"
        run: python watcher.py rescan --max-minutes 330

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg libgl1 > /dev/null
          pip install -q -r requirements.txt
          pip install -q -U --pre "yt-dlp[default]"   # newest yt-dlp (incl. nightly): YouTube changes often
      - name: Optional YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_COOKIES_FILE: cookies.txt
          VIDEO_URL: ${{ inputs.url }}
        run: python watcher.py vod "$VIDEO_URL" ${{ inputs.post && '--post' || '' }}
